schema_version: 1

context:
  name: aws-c-compression
  version: "0.3.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/awslabs/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: 33a91db709a547f417b1b23fdb76a64727ee8fb7ed88dd1a43be117f402db356

build:
  number: 1

requirements:
  build:
    - cmake
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ninja
  host:
    - aws-c-common
  run_exports:
    - ${{ pin_subpackage("aws-c-compression", upper_bound="x.x.x") }}

tests:
  - script:
      - if: unix
        then:
          - test -f $PREFIX/lib/libaws-c-compression${SHLIB_EXT}
          - test -f $PREFIX/include/aws/compression/compression.h
      - if: win
        then:
          - if not exist %LIBRARY_INC%\\aws\\compression\\compression.h exit 1
          - if not exist %PREFIX%\\Library\\bin\\aws-c-compression.dll exit 1
  - if: win and arm64
    then:
      requirements:
        run:
          - ${{ compiler('c') }}
          - cmake
      files:
        recipe:
          - CMakeLists.txt
          - consumer.c
      script:
        - cmake -S . -B consumer-build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%"
        - cmake --build consumer-build
        - consumer-build\compression_consumer.exe
        - dumpbin /headers "%LIBRARY_BIN%\aws-c-compression.dll" | findstr /I /C:"AA64 machine (ARM64)"
        - dumpbin /headers consumer-build\compression_consumer.exe | findstr /I /C:"AA64 machine (ARM64)"
about:
  license: Apache-2.0
  license_file: LICENSE
  summary: C99 implementation of huffman encoding/decoding
  homepage: https://github.com/awslabs/aws-c-compression
  repository: https://github.com/awslabs/aws-c-compression

extra:
  feedstock-name: aws-c-compression
  recipe-maintainers:
    - xhochy
    - conda-forge/aws-sdk-cpp
